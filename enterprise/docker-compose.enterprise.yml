services:
  legalii:
    image: python:3.11-slim
    container_name: legalii-enterprise
    working_dir: /app
    command: >
      bash -lc "pip install --no-cache-dir fastapi uvicorn python-multipart pypdf python-docx pillow pytesseract reportlab
      && uvicorn legalii-kit.app:app --host 0.0.0.0 --port 8777"
    volumes:
      - ..:/app
      - ./data:/app/enterprise/data
      - ./logs:/app/enterprise/logs
    env_file:
      - .env.enterprise
    ports:
      - "8777:8777"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8777/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: legalii-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:

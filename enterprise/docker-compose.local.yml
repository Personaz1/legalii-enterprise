version: '3.9'
services:
  legalii:
    image: python:3.11-slim
    container_name: legalii-local
    working_dir: /app
    command: bash -lc "pip install --no-cache-dir fastapi uvicorn python-multipart && uvicorn legalii-kit.app:app --host 0.0.0.0 --port 8777"
    volumes:
      - ..:/app
      - ./data:/app/enterprise/data
      - ./logs:/app/enterprise/logs
    environment:
      LEGALII_ENV: local
      LEGALII_REQUIRE_AUTH: "false"
      LEGALII_AUDIT_LOG: /app/enterprise/logs/audit.log
    ports:
      - "8777:8777"
    restart: unless-stopped

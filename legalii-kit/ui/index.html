<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEGALII Enterprise</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>LEGALII Enterprise</h1>
      <p>Operations Console — intake, review workflow, auth and system health.</p>
    </div>
    <div class="top-right">
      <span id="health" class="badge">checking…</span>
      <button id="refreshAllBtn" class="ghost">Refresh</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="review">Review Queue</button>
    <button class="tab" data-tab="admin">Admin</button>
  </nav>

  <main>
    <section class="pane active" data-pane="dashboard">
      <div class="grid">
        <section class="card">
          <h2>Authentication</h2>
          <div class="row">
            <input id="apiKey" placeholder="x-api-key / token" />
            <button id="saveKeyBtn">Save Key</button>
            <button id="whoamiBtn" class="ghost">Who am I</button>
          </div>
          <div class="row">
            <input id="username" placeholder="username" />
            <input id="password" type="password" placeholder="password" />
            <button id="loginBtn">Login</button>
          </div>
        </section>

        <section class="card">
          <h2>Case Intake</h2>
          <div class="row">
            <input id="file" type="file" multiple />
          </div>
          <div class="row">
            <button id="uploadBtn">Analyze Upload</button>
            <button id="batchBtn">Analyze Batch</button>
          </div>
          <div class="row">
            <button data-sample="extranjeria">Sample: Asilo</button>
            <button data-sample="arraigo">Sample: Arraigo</button>
            <button data-sample="nacionalidad">Sample: Nacionalidad</button>
          </div>
        </section>

        <section class="card full">
          <h2>Result</h2>
          <pre id="out">Run analysis to see structured output…</pre>
        </section>
      </div>
    </section>

    <section class="pane" data-pane="review">
      <div class="grid">
        <section class="card full">
          <h2>Pending Reviews</h2>
          <div class="row">
            <button id="loadQueueBtn">Load Pending</button>
          </div>
          <div id="reviewTableWrap" class="table-wrap"></div>
        </section>

        <section class="card full">
          <h2>Resolve Review</h2>
          <div class="row">
            <input id="reviewId" placeholder="review id" />
            <select id="reviewDecision">
              <option value="approved">approved</option>
              <option value="rejected">rejected</option>
            </select>
            <input id="reviewNote" placeholder="note" />
            <button id="resolveReviewBtn">Resolve</button>
          </div>
        </section>
      </div>
    </section>

    <section class="pane" data-pane="admin">
      <div class="grid">
        <section class="card">
          <h2>System Config</h2>
          <div class="row"><button id="loadConfigBtn">Load Config</button></div>
          <pre id="configOut">Config not loaded.</pre>
        </section>
        <section class="card">
          <h2>User Management (Admin)</h2>
          <div class="row"><button id="listUsersBtn">List Users</button></div>
          <div class="row">
            <input id="newUsername" placeholder="username" />
            <input id="newPassword" placeholder="password (min 8)" type="password" />
            <select id="newRole">
              <option value="assistant">assistant</option>
              <option value="lawyer">lawyer</option>
              <option value="admin">admin</option>
            </select>
            <select id="newEnabled">
              <option value="true">enabled</option>
              <option value="false">disabled</option>
            </select>
            <button id="upsertUserBtn">Create / Update</button>
          </div>
          <pre id="usersOut">Users not loaded.</pre>
        </section>
      </div>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
